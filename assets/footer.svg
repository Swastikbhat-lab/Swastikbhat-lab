  <rect x="40" y="58" width="1120" height="18" fill="#161b22"/>
  <circle cx="78" cy="53" r="6.5" fill="#3d444d"/>
  <circle cx="99" cy="53" r="6.5" fill="#3d444d"/>
  <circle cx="120" cy="53" r="6.5" fill="#3d444d"/>
